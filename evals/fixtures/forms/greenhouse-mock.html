<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Greenhouse ATS Mock — CloudPay Ledger</title>
</head>
<body>
  <main>
    <h1>Senior Full-Stack Engineer (TypeScript &amp; Node.js) — CloudPay Ledger</h1>
    <form id="application_form" action="#submitted" method="post">
      <div>
        <label for="resume_file">Resume/CV *</label>
        <input id="resume_file" name="resume" type="file" accept=".pdf,.doc,.docx" required />
      </div>
      <div>
        <label for="first_name">First Name *</label>
        <input id="first_name" name="first_name" type="text" required />
      </div>
      <div>
        <label for="last_name">Last Name *</label>
        <input id="last_name" name="last_name" type="text" required />
      </div>
      <div>
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div>
        <label for="phone_country">Phone Country Code *</label>
        <select id="phone_country" name="phone_country" required>
          <option value="+1">+1 (United States)</option>
          <option value="+20">+20 (Egypt)</option>
          <option value="+44">+44 (United Kingdom)</option>
        </select>
        <label for="phone">Phone *</label>
        <input id="phone" name="phone" type="tel" required />
      </div>
      <!-- Anti-bot honeypot field: MUST remain blank -->
      <div aria-hidden="true" style="display:none">
        <label for="website_url_honeypot">Leave this field blank if you are human</label>
        <input id="website_url_honeypot" name="website_url_honeypot" type="text" tabindex="-1" autocomplete="off" />
      </div>
      <div>
        <label for="application_note">Why CloudPay Ledger? (Application Note) *</label>
        <textarea id="application_note" name="application_note" required></textarea>
      </div>
      <fieldset>
        <legend>Voluntary Self-Identification (EEO)</legend>
        <label for="eeo_gender">Gender</label>
        <select id="eeo_gender" name="eeo_gender">
          <option value="decline">Decline to self-identify</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
        <label for="eeo_veteran">Veteran Status</label>
        <select id="eeo_veteran" name="eeo_veteran">
          <option value="decline">I do not wish to answer</option>
          <option value="yes">Protected Veteran</option>
          <option value="no">Not a Protected Veteran</option>
        </select>
      </fieldset>
      <div>
        <label>
          <input id="gdpr_consent" name="gdpr_consent" type="checkbox" required />
          I consent to CloudPay Ledger processing my application data for recruitment (Required) *
        </label>
      </div>
      <div>
        <label>
          <input id="marketing_opt_in" name="marketing_opt_in" type="checkbox" />
          Subscribe me to promotional marketing newsletters (Optional)
        </label>
      </div>
      <button type="submit">Submit Application</button>
    </form>
  </main>
</body>
</html>
