name: Validate Pure Markdown Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate all JSON files
        run: |
          python3 - <<'PY'
          import json, pathlib

          checked = 0
          for p in sorted(pathlib.Path(".").rglob("*")):
              if ".git" in p.parts or not p.is_file():
                  continue
              if p.suffix == ".json" or p.name.endswith(".json.example"):
                  json.loads(p.read_text(encoding="utf-8"))
                  checked += 1
          print(f"Validated {checked} JSON file(s).")
          PY

      - name: Validate all YAML files
        run: |
          ruby -ryaml -e '
            checked = 0
            Dir.glob("**/*", File::FNM_DOTMATCH).sort.each do |f|
              next if f.start_with?(".git/") || !File.file?(f)
              next unless f.end_with?(".yaml", ".yml", ".yaml.example")
              YAML.safe_load(File.read(f), aliases: true)
              checked += 1
            end
            puts "Validated #{checked} YAML file(s)."
          '

      - name: Validate skills frontmatter, registry, and Markdown links
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          manifest = json.loads(pathlib.Path("skills/skills-manifest.json").read_text(encoding="utf-8"))
          registry = pathlib.Path("skills/REGISTRY.md").read_text(encoding="utf-8")
          required_keys = ["name", "version", "description", "triggers", "requires_mcp", "preconditions", "requires_skills", "verification"]
          required_sections = [
              "## When to Use & Preconditions",
              "## Deterministic Step-by-Step Execution",
              "## Anti-Patterns (What NEVER To Do) & Self-Verification Check",
          ]

          skill_files = sorted(
              p for p in pathlib.Path("skills").rglob("*.md")
              if p.name not in ("REGISTRY.md", "README.md") and not p.name.startswith("_")
          )
          manifest_paths = {pathlib.Path(s["path"]).as_posix() for s in manifest["skills"]}
          actual_paths = {p.as_posix() for p in skill_files}
          if manifest_paths != actual_paths:
              raise SystemExit(f"Manifest mismatch: missing={actual_paths - manifest_paths}, extra={manifest_paths - actual_paths}")

          for p in skill_files:
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  raise SystemExit(f"Missing YAML frontmatter: {p}")
              end = text.find("\n---", 3)
              if end < 0:
                  raise SystemExit(f"Unterminated YAML frontmatter: {p}")
              fm = text[3:end]
              for k in required_keys:
                  if not re.search(rf"^{re.escape(k)}:", fm, re.M):
                      raise SystemExit(f"{p} missing frontmatter key: {k}")
              body = text[end + 4:]
              for sec in required_sections:
                  if sec not in body:
                      raise SystemExit(f"{p} missing section: {sec}")
              if p.as_posix() not in registry:
                  raise SystemExit(f"{p} not indexed in skills/REGISTRY.md")

          agent_skills = sorted(pathlib.Path(".agents/skills").glob("*/SKILL.md"))
          expected_wrappers = {
              "apply-url", "contract-and-nda-auditor", "daily-run", "demo",
              "linkedin-growth", "offer-negotiator", "recruiter-inbox-triage",
              "rejection-pattern-analyzer", "score-calibration", "setup",
              "tailor-cv", "weekly-report",
          }
          actual_wrappers = {ap.parent.name for ap in agent_skills}
          if actual_wrappers != expected_wrappers:
              raise SystemExit(f".agents/skills mismatch: missing={expected_wrappers - actual_wrappers}, extra={actual_wrappers - expected_wrappers}")
          for ap in agent_skills:
              atext = ap.read_text(encoding="utf-8")
              if not atext.startswith("---"):
                  raise SystemExit(f"Missing YAML frontmatter: {ap}")
              aend = atext.find("\n---", 3)
              if aend < 0:
                  raise SystemExit(f"Unterminated YAML frontmatter: {ap}")
              afm = atext[3:aend]
              if not re.search(rf"^name:\s*{re.escape(ap.parent.name)}\s*$", afm, re.M):
                  raise SystemExit(f"{ap} frontmatter name must match folder {ap.parent.name}")
              if not re.search(r"^description:\s*\S.{19,}", afm, re.M):
                  raise SystemExit(f"{ap} missing valid description")

          broken = []
          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              for m in re.finditer(r"\[[^\]]*\]\(([^)]+)\)", text):
                  target = m.group(1).split("#", 1)[0].strip()
                  if not target or re.match(r"^(https?:|mailto:|#)", target, re.I):
                      continue
                  if not (md.parent / target).resolve().exists():
                      broken.append(f"{md} -> {m.group(1)}")
              for m in re.finditer(r"(?<![A-Za-z0-9_./-])(skills/[A-Za-z0-9_./-]+\.md)(?![A-Za-z0-9_/-])", text):
                  if not pathlib.Path(m.group(1)).exists():
                      broken.append(f"{md} -> {m.group(1)}")
          if broken:
              raise SystemExit("Broken links:\n" + "\n".join(broken))
          print(f"Validated {len(skill_files)} skills, {len(agent_skills)} .agents/skills wrappers, REGISTRY.md, and 0 broken Markdown links.")
          PY

      - name: Security audit — ensure no sensitive files are tracked in Git
        run: |
          python3 - <<'PY'
          import re, subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [
              f for f in tracked
              if re.search(r"(\.pdf$|^\.env$|browser-profile|^logs/|^context/(?!.*\.example$|DROP_YOUR_FILES_HERE\.md$))", f)
          ]
          if bad:
              raise SystemExit("Sensitive files tracked in Git:\n" + "\n".join(bad))
          print(f"Security audit passed across {len(tracked)} tracked files.")
          PY

      - name: Provenance & Attribution Integrity Check
        run: |
          python3 - <<'PY'
          import json, pathlib

          required = ["NOTICE", "AUTHORS.md", "PROVENANCE.json", ".github/CODEOWNERS", "LICENSE"]
          for rel in required:
              p = pathlib.Path(rel)
              if not p.is_file():
                  raise SystemExit(f"Missing required provenance file: {rel}")
              text = p.read_text(encoding="utf-8")
              if "redasalem" not in text.lower():
                  raise SystemExit(f"Provenance file tampered (missing redasalem attribution): {rel}")

          prov = json.loads(pathlib.Path("PROVENANCE.json").read_text(encoding="utf-8"))
          assert prov.get("github_handle") == "redasalem", "PROVENANCE.json github_handle mismatch"
          assert prov.get("canonical_repository") == "https://github.com/redasalem/job-hunter-os", "PROVENANCE.json canonical_repository mismatch"
          print("Provenance & attribution integrity check passed for all 5 required files.")
          PY

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check CLI syntax & run deterministic Skill Eval Harness (Reference Baseline)
        run: |
          node --check bin/cli.mjs
          node ./bin/cli.mjs eval --baseline

      - name: Test local init, doctor, eval, and sync-mcp in isolated directory
        shell: bash
        run: |
          TMP_BASE="$(mktemp -d)"
          trap 'rm -rf "$TMP_BASE"' EXIT
          ISO_HOME="$TMP_BASE/home"
          ISO_PROJ="$TMP_BASE/project"
          mkdir -p "$ISO_HOME" "$ISO_PROJ"
          REPO_DIR="$(pwd)"

          (
            cd "$ISO_PROJ"
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" init
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" doctor
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" eval --baseline
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" status
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" bundle
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" dashboard --no-open
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" unlock
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" backup
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" sync-mcp
          )

          test -f "$ISO_PROJ/AGENTS.md"
          test -f "$ISO_PROJ/skills/REGISTRY.md"
          test -f "$ISO_PROJ/.agents/skills/daily-run/SKILL.md"
          test -f "$ISO_PROJ/logs/exports/web-chat-master-prompt.md"
          test -f "$ISO_PROJ/logs/exports/dashboard.html"
          test -f "$ISO_PROJ/.mcp.json"
          test -f "$ISO_PROJ/.cursor/mcp.json"

      - name: Test global init and doctor in isolated HOME
        shell: bash
        run: |
          TMP_BASE="$(mktemp -d)"
          trap 'rm -rf "$TMP_BASE"' EXIT
          ISO_HOME="$TMP_BASE/home"
          mkdir -p "$ISO_HOME"
          REPO_DIR="$(pwd)"

          HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" init --global
          HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" doctor --global

          test -f "$ISO_HOME/.job-hunter-os/AGENTS.md"
          test -f "$ISO_HOME/.agents/skills/daily-run/SKILL.md"
          test -f "$ISO_HOME/.claude/skills/daily-run/SKILL.md"
          test -f "$ISO_HOME/.cursor/rules/job-hunter.mdc"
          test -f "$ISO_HOME/.gemini/antigravity/global_workflows/daily-run.md"
          test -f "$ISO_HOME/.claude.json"
          test -f "$ISO_HOME/.cursor/mcp.json"
