# Safety settings read by every skill. Start with dry_run: true.
dry_run: true
max_applications_per_day: 20
max_per_platform:
  linkedin: 12
  wellfound: 5
  wuzzuf: 5
  ashby: 3
  smartrecruiters: 3
  breezyhr: 3
  indeed: 3
  glassdoor: 3
  dice: 3
  ziprecruiter: 3
  weworkremotely: 3
  remoteok: 3
  builtin: 3
  welcometothejungle: 3
  bayt: 3
  greenhouse: 3
  lever: 3
  workday: 0
  taleo: 0
  other: 0
min_match_score: 7
# Compatibility-only legacy field; agent actions use human_behavior [3, 9] below.
delay_seconds: [3, 8]
max_consecutive_errors: 3
stop_on_captcha: true
review_min_score: 5
stop_on_2fa: true
tailor_resume_per_job: true
warmup_mode:
  # Also cap the first three distinct non-aborted run dates at 5; see agent-policy.ts.
  enabled: true
  started_on: null
  initial_cap: 5
  stage_days: 3
  increment: 5
active_hours:
  start: "09:00"
  end: "20:00"
  timezone: UTC
human_behavior:
  action_delay_seconds: [3, 9]
  scroll_jitter: false
  max_consecutive_actions: 15
  cooldown_seconds: 60
storage_adapters:
  local_json: true
  notion_mcp: false
  csv_export: true
  markdown_report: true
